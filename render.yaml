# Render blueprint for the FloroBeat backend (Listen Together + Real-Time Messenger).
services:
  - type: web
    name: florobeat-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --ws websockets
    healthCheckPath: /healthz
    numInstances: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: JAM_MAX_MEMBERS
        value: "5"
      - key: JAM_STATE_HEARTBEAT_MS
        value: "5000"
      - key: JAM_PLAY_LEAD_MS
        value: "350"
